name: Validation
on:
  # Pull requests run as pull_request; main's push run gates the deploy. Branch
  # pushes would only repeat the PR run and queue behind it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:scripts
      - run: bun run lint
      - run: bun test
      # Downloads the local backend binary into the CLI cache (an anonymous,
      # throwaway deployment inside this runner; no account or secret).
      - name: Fetch the Convex local backend
        run: CONVEX_AGENT_MODE=anonymous bunx convex dev --once
      - name: Backend acceptance on a disposable Convex backend
        run: ./scripts/test-convex.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        proof: [boundary, shop, checkout, admin, admins, scanner, labels, statistics, news]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # One install for all browsers, so a slow mirror is paid once; a stalled apt
      # connection times out and retries instead of waiting for the job limit.
      - name: Install local proof prerequisites
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "60"; Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-network
          sudo apt-get update
          sudo apt-get install -y libnss3-tools python3-venv jq
          bunx --no-install playwright install --with-deps firefox ${{ matrix.proof == 'scanner' && 'webkit' || '' }}
      - if: matrix.proof == 'labels'
        run: |
          python3 -m venv .venv-proof
          .venv-proof/bin/pip install PyMuPDF==1.28.2
          echo "$PWD/.venv-proof/bin" >> "$GITHUB_PATH"
      - name: Fetch the Convex local backend
        run: CONVEX_AGENT_MODE=anonymous bunx convex dev --once
      - name: Build and run disposable browser acceptance
        env:
          PROOF: ${{ matrix.proof }}
        run: |
          if [ "$PROOF" = boundary ]; then
            ./scripts/test-web.sh
          else
            ./scripts/test-web.sh "--$PROOF"
          fi
