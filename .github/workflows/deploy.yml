name: Deploy
# Production deploys once Validation passes for a push to main (docs/runbook-deploy.md#publish).
# A separate workflow, since deploy:production waits for that Validation run to complete.
on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time. Never cancel a running deploy: it may be mid-rollback.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Validation runs can finish out of order; only main's tip deploys, so an
      # older commit never replaces a newer one. The tip deploys from its own run.
      - name: Check the commit is still main's tip
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Skipping $SHA; main is now $tip."; fi
      - if: steps.tip.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - if: steps.tip.outputs.current == 'true'
        run: bun install --frozen-lockfile
      - if: steps.tip.outputs.current == 'true'
        name: Deploy, verify and roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffdf1ff5874475b8eaf9f691e42f27ce
        run: bun run deploy:production
