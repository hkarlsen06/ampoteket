name: Validation
on:
  # Pull requests run as pull_request; main's push run gates the deploy. Branch
  # pushes would only repeat the PR run and queue behind it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:scripts
      - run: bun run lint
      - run: bun test
      # Downloads the local backend binary into the CLI cache (an anonymous,
      # throwaway deployment inside this runner; no account or secret).
      - name: Fetch the Convex local backend
        timeout-minutes: 5
        run: |
          fetch() { CONVEX_AGENT_MODE=anonymous timeout -k 10s 2m bunx convex dev --once; }
          fetch || { echo '::warning::Convex backend fetch failed or stalled; retrying once'; fetch; }
      - name: Backend acceptance on a disposable Convex backend
        run: ./scripts/test-convex.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        proof: [boundary, shop, checkout, admin, admins, scanner, labels, statistics, news]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # A healthy install takes under a minute. Azure's Ubuntu mirror can trickle at a
      # few kB/s without going silent, so apt's own timeouts never fire. Each attempt
      # is capped, and the retry drops that mirror from the runner's apt mirror list.
      # The cap on apt runs as root because a runner-owned timeout kills sudo and
      # leaves apt running with the dpkg lock held.
      - name: Install local proof prerequisites
        timeout-minutes: 7
        env:
          BROWSERS: firefox ${{ matrix.proof == 'scanner' && 'webkit' || '' }}
        run: |
          read -ra names <<< "$BROWSERS"
          attempt() {
            sudo timeout -k 10s 2m env "PATH=$PATH" bash -ec "
              bunx --no-install playwright install-deps ${names[*]}
              apt-get install -y libnss3-tools python3-venv jq" &&
              timeout -k 10s 1m bunx --no-install playwright install "${names[@]}"
          }
          attempt || {
            echo '::warning::Install failed or stalled; retrying without the Azure apt mirror'
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            sudo dpkg --configure -a
            attempt
          }
      - if: matrix.proof == 'labels'
        run: |
          python3 -m venv .venv-proof
          .venv-proof/bin/pip install PyMuPDF==1.28.2
          echo "$PWD/.venv-proof/bin" >> "$GITHUB_PATH"
      - name: Fetch the Convex local backend
        timeout-minutes: 5
        run: |
          fetch() { CONVEX_AGENT_MODE=anonymous timeout -k 10s 2m bunx convex dev --once; }
          fetch || { echo '::warning::Convex backend fetch failed or stalled; retrying once'; fetch; }
      - name: Build and run disposable browser acceptance
        env:
          PROOF: ${{ matrix.proof }}
        run: |
          if [ "$PROOF" = boundary ]; then
            ./scripts/test-web.sh
          else
            ./scripts/test-web.sh "--$PROOF"
          fi
